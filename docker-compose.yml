services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: k2_orders
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/k2_orders
    depends_on:
      - db

volumes:
  postgres_data: